name: Production

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/exodiaaaa/jersey-store

jobs:
  quality:
    name: Tests and quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  image:
    name: Build and publish image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable image reference
        id: image
        shell: bash
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: kvn-footwear-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      IMAGE_REF: ${{ needs.image.outputs.image_ref }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/kvn-deploy-${GITHUB_SHA}"
          ssh "$VPS_USER@$VPS_HOST" "install -d -m 700 '$remote_dir'"
          scp \
            docker-compose.deploy.yml \
            deploy/backup-db.sh \
            deploy/install-backup-timer.sh \
            deploy/kvn-footwear-backup.service \
            deploy/kvn-footwear-backup.timer \
            deploy/remote-deploy.sh \
            "$VPS_USER@$VPS_HOST:$remote_dir/"
          ssh "$VPS_USER@$VPS_HOST" "
            sudo install -d -m 755 /var/www/kvn-footwear/deploy &&
            sudo install -m 644 '$remote_dir/docker-compose.deploy.yml' /var/www/kvn-footwear/docker-compose.deploy.yml &&
            sudo install -m 750 '$remote_dir/backup-db.sh' /var/www/kvn-footwear/deploy/backup-db.sh &&
            sudo install -m 750 '$remote_dir/install-backup-timer.sh' /var/www/kvn-footwear/deploy/install-backup-timer.sh &&
            sudo install -m 644 '$remote_dir/kvn-footwear-backup.service' /var/www/kvn-footwear/deploy/kvn-footwear-backup.service &&
            sudo install -m 644 '$remote_dir/kvn-footwear-backup.timer' /var/www/kvn-footwear/deploy/kvn-footwear-backup.timer &&
            sudo install -m 750 '$remote_dir/remote-deploy.sh' /var/www/kvn-footwear/deploy/remote-deploy.sh &&
            rm -f '$remote_dir/docker-compose.deploy.yml' '$remote_dir/backup-db.sh' '$remote_dir/install-backup-timer.sh' '$remote_dir/kvn-footwear-backup.service' '$remote_dir/kvn-footwear-backup.timer' '$remote_dir/remote-deploy.sh' &&
            rmdir '$remote_dir'
          "

      - name: Log in to the private registry on the VPS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "sudo docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy immutable image
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" \
            "sudo /var/www/kvn-footwear/deploy/remote-deploy.sh '$IMAGE_REF'"

      - name: Log out from the registry on the VPS
        if: always()
        shell: bash
        run: ssh "$VPS_USER@$VPS_HOST" "sudo docker logout ghcr.io" || true

